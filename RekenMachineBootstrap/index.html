<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>
    <br>

    <div class="container-fluid text-center px-3">
        <div class="row g-3 align-items-start">

            <!-- CARD 1 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        Featured
                    </div>

                    <div class="card-body">
                        <div class="row g-1 align-items-center">
                            <div class="col">
                                <label for="inputTafel" class="col-form-label">Welke tafel?</label>
                            </div>

                            <div class="col">
                                <input type="number" id="inputTafel" class="form-control">
                            </div>

                            <div class="col">
                                <a href="#" class="btn btn-success" onclick="showTafel()">GO!</a>
                            </div>
                        </div>

                        <p class="card-text" id="outputTafel">
                        </p>
                    </div>
                </div>
            </div>

            <!-- CARD 2 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        Featured
                    </div>

                    <div class="card-body">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <p class="card-text" id="outputRandomTafel">
                                    <br>
                                    7x3=<br>
                                </p>
                            </div>

                            <div class="col">
                                <input type="number" id="inputRandomTafel" class="form-control">
                            </div>

                            <div class="col">
                                <a href="#" class="btn btn-success" onclick="randomTafelifCorrect()">Check</a>
                            </div>
                        </div>

                        <p class="card-text" id="antRandomTafel">
                            <br>
                            Dat is correct, volgende som:<br>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="Function.js"></script>
</body>

</html>
